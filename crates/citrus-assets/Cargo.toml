[package]
name = "citrus-assets"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
citrus-core.workspace = true
citrus-render.workspace = true
bytemuck.workspace = true
gltf.workspace = true
ufbx.workspace = true
image.workspace = true
half.workspace = true
