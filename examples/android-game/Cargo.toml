[package]
name = "android-game"
version = "0.1.0"
edition = "2024"

# Android packaging example: the game as a cdylib with an `android_main` entry,
# packaged into an APK by tools/android/build_apk.sh. Standalone like
# sample-game.
[workspace]

[lib]
name = "android_game"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
citrus-engine = { path = "../../crates/citrus-engine", default-features = false }
tracing = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
